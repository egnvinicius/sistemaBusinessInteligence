name: bi-platform

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bi}
      POSTGRES_USER: ${POSTGRES_USER:-bi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bi} -d ${POSTGRES_DB:-bi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-bi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bi}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      CHAVE_CRIPTOGRAFIA: ${CHAVE_CRIPTOGRAFIA:?Defina CHAVE_CRIPTOGRAFIA no .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      FUSO_AGENDA: ${FUSO_AGENDA:-America/Sao_Paulo}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_SENHA: ${ADMIN_SENHA:?Defina ADMIN_SENHA no .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ACCESS_TOKEN_MINUTOS: ${ACCESS_TOKEN_MINUTOS:-15}
      REFRESH_TOKEN_DIAS: ${REFRESH_TOKEN_DIAS:-7}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_DOMINIO: ${GOOGLE_DOMINIO:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      IA_LIMITE_DIARIO: ${IA_LIMITE_DIARIO:-50}
    volumes:
      - uploads:/app/uploads

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db-data:
  uploads:
